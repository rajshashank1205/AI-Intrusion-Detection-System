<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h1>Login</h1>

<form method="POST">

    <label>Username</label><br>
    <input type="text" name="username"><br><br>

    <label>Password</label><br>
    <input type="password" name="password"><br><br>

    <button type="submit">Login</button>

</form>

{% if message %}
<h3>{{ message }}</h3>
{% endif %}

<br>

<a href="/">Home</a>

</body>
</html>
